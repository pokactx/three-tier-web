version: 0.0
os: linux
files:
  - source: html
    destination: /usr/share/nginx/html
file_exists_behavior: OVERWRITE
hooks:
  AfterInstall:
    - location: scripts/after_install.sh
      timeout: 180
      runas: root
  ValidateService:
    - location: scripts/validate.sh
      timeout: 60
      runas: root
